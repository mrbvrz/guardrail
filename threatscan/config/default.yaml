# Advanced Webshell Scanner - Default Configuration
# Copy to scan-config.yaml and customize

scanner:
  threads: "auto"           # auto, or number (max 32)
  timeout: 300              # per-file timeout in seconds
  max_file_size: "10MB"     # KB, MB, GB
  follow_symlinks: false
  cache_dir: ""             # empty = disabled
  incremental: false        # use cache for unchanged files
  stream_mode: false        # low memory mode
  batch_size: 100           # files per batch

detection:
  yara:
    enabled: true
    rules_dir: "./rules/yara"
    compiled_rules: ""      # path to .yarc file
    custom_rules: []        # additional rule directories
  
  entropy:
    enabled: true
    threshold: 7.5          # 0-8, higher = more suspicious
    min_length: 100         # minimum string length to analyze
    exclude_extensions: [".jpg", ".jpeg", ".png", ".gif", ".pdf", ".zip", ".gz", ".tar", ".woff", ".woff2", ".ttf", ".eot"]
  
  heuristics:
    enabled: true
    threshold: 70           # 0-100, score to flag as suspicious
    weights:
      dangerous_functions: 15
      obfuscation: 20
      user_input_sinks: 25
      file_operations: 15
      network_operations: 10
      suspicious_strings: 10
      entropy: 5
      yara_bonus: 30
  
  signatures:
    enabled: true
    database: "./signatures/webshells.ndb"

output:
  formats: ["console", "json", "html"]  # console, json, sarif, html, junit
  output_dir: "./reports"
  html_template: "./templates/dashboard.html"
  fail_on: "HIGH"           # LOW, MEDIUM, HIGH, CRITICAL

quarantine:
  enabled: false
  directory: "./quarantine"
  threshold: "HIGH"         # quarantine files at or above this severity
  preserve_structure: true
  zip_password: "infected"

git:
  enabled: true
  scan_changed_only: false
  since_commit: ""          # commit hash
  diff: ""                  # ref1..ref2
  history: false            # scan entire history
  since_date: "30 days ago" # for history mode
  exclude_branches: ["main", "master", "release/*"]

whitelist:
  paths:
    - "vendor/"
    - "node_modules/"
    - "storage/"
    - ".git/"
    - ".idea/"
    - ".vscode/"
    - "__pycache__/"
    - ".next/"
    - "dist/"
    - "build/"
    - "coverage/"
    - ".cache/"
  patterns:
    - "*.min.js"
    - "*.bundle.js"
    - "*.map"
    - "*.min.css"
  files: []

threat_intel:
  enabled: false
  virustotal_api_key: ""    # set via env VT_API_KEY or --vt-api-key
  malwarebazaar: true
  cache_ttl: 86400          # 24 hours